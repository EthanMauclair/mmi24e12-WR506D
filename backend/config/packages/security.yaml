security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Un membre bloqué par le super admin ne peut plus se connecter
            user_checker: App\Security\VerificateurCompte
            # Session par cookie : le front est servi sur la même origine que l'API (proxy Vite)
            entry_point: App\Security\PointEntreeApi
            access_denied_handler: App\Security\AccesRefuseHandler
            json_login:
                check_path: api_connexion
                username_path: email
                password_path: motDePasse
                failure_handler: App\Security\ConnexionEchoueeHandler
            login_throttling:
                max_attempts: 5
            logout:
                path: api_deconnexion

    # Le super admin (propriétaire du site) a tous les droits de l'administrateur
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    # Note: Only the *first* matching rule is applied
    access_control:
        # Back office : référentiels et modération pour l'administrateur ; membres et indicateurs pour le super admin
        - { path: ^/api/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/(health|connexion|inscription)$, roles: PUBLIC_ACCESS }
        # Réseau social : un visiteur sans compte consulte les profils publics et leurs articles
        # (les voters ProfilVoter et ArticleVoter décident ensuite au cas par cas)
        - { path: ^/api/(membres|profils/[^/]+(/(articles|abonnes|abonnements|tenues))?|(articles|tenues)/\d+(/commentaires)?)$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
