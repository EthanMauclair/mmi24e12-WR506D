# Messages renvoyés par l'API : le texte français sert de clé (langue principale de l'application)
"Ajoutez une photo de l'article.": "Adicione uma foto do artigo."
"Aucun compte ne correspond à cet e-mail.": "Nenhuma conta corresponde a este e-mail."
"Aucun livre ni vinyle trouvé pour ce code-barres. Vous pouvez saisir l'article vous-même.": "Nenhum livro nem vinil encontrado para este código de barras. Pode introduzir o artigo manualmente."
"Aucun membre ne porte ce pseudo.": "Nenhum membro tem este nome de utilizador."
"Ce fichier n'est pas une image lisible (JPEG, PNG ou WebP).": "Este ficheiro não é uma imagem legível (JPEG, PNG ou WebP)."
"Ce prêt est déjà marqué comme rendu.": "Este empréstimo já está marcado como devolvido."
"Certaines informations sont invalides.": "Algumas informações são inválidas."
"Cet emplacement n'existe pas.": "Esta localização não existe."
"Cette annonce est terminée : elle ne peut plus être modifiée.": "Este anúncio terminou: já não pode ser alterado."
"Cette annonce n'est plus en ligne.": "Este anúncio já não está publicado."
"Cette catégorie contient des articles ou des sous-catégories : elle ne peut pas être supprimée.": "Esta categoria contém artigos ou subcategorias: não pode ser eliminada."
"Cette couleur est utilisée par des articles : elle ne peut pas être supprimée.": "Esta cor é usada por artigos: não pode ser eliminada."
"Cette couleur n'existe pas.": "Esta cor não existe."
"Cette couverture ne provient pas d'une source reconnue.": "Esta capa não provém de uma fonte reconhecida."
"Cette demande d'abonnement n'existe plus.": "Este pedido para seguir já não existe."
"Cette photo n'est plus disponible : reprenez la photo.": "Esta foto já não está disponível: tire-a novamente."
"Cette valeur doit être vraie ou fausse.": "Este valor deve ser verdadeiro ou falso."
"Choisissez l'acheteur parmi les membres qui vous ont écrit.": "Escolha o comprador entre os membros que lhe escreveram."
"Choisissez la catégorie parente.": "Escolha a categoria principal."
"Choisissez un logement.": "Escolha uma casa."
"Choisissez un type de stockage.": "Escolha um tipo de arrumação."
"Choisissez une catégorie.": "Escolha uma categoria."
"Conversation introuvable.": "Conversa não encontrada."
"Date invalide.": "Data inválida."
"E-mail ou mot de passe incorrect.": "E-mail ou palavra-passe incorretos."
"E-mail ou mot de passe manquant.": "Falta o e-mail ou a palavra-passe."
"Indiquez l'e-mail du compte majeur qui vous rattache.": "Indique o e-mail da conta do adulto à qual está associado."
"Indiquez un prix en euros, par exemple 18 ou 12,50.": "Indique um preço em euros, por exemplo 18 ou 12,50."
"Indiquez à qui vous prêtez l'article.": "Indique a quem empresta o artigo."
"L'IA n'a pas pu analyser la photo pour le moment : remplissez les champs vous-même.": "A IA não conseguiu analisar a foto de momento: preencha os campos manualmente."
"La date de prêt ne peut pas être dans le futur.": "A data do empréstimo não pode ser no futuro."
"La reconnaissance automatique n'est pas configurée : remplissez les champs vous-même.": "O reconhecimento automático não está configurado: preencha os campos manualmente."
"Le corps de la requête doit être un objet JSON.": "O corpo do pedido tem de ser um objeto JSON."
"Les bases de livres et de disques ne répondent pas pour le moment. Réessayez dans quelques secondes.": "As bases de dados de livros e discos não estão a responder de momento. Tente novamente dentro de alguns segundos."
"Mode d'ajout inconnu.": "Modo de adição desconhecido."
"Rôle inconnu.": "Função desconhecida."
"Seul le prêteur peut modifier ce prêt.": "Só quem emprestou pode alterar este empréstimo."
"Seul le vendeur peut modifier cette annonce.": "Só o vendedor pode alterar este anúncio."
"Seul un article disponible (ni prêté, ni déjà en vente) peut être mis en vente.": "Só um artigo disponível (nem emprestado, nem já à venda) pode ser posto à venda."
"Seul un de vos abonnés peut être choisi comme ami.": "Só um dos seus seguidores pode ser escolhido como amigo."
"Statut inconnu.": "Estado desconhecido."
"Trop de tentatives de connexion. Réessayez dans quelques minutes.": "Demasiadas tentativas de início de sessão. Tente novamente dentro de alguns minutos."
"Un article en vente ou vendu ne peut pas être prêté.": "Um artigo à venda ou vendido não pode ser emprestado."
"Un des articles de la tenue n'existe plus.": "Um dos artigos do conjunto já não existe."
"Une étiquette choisie n'appartient pas à ce logement.": "Uma etiqueta escolhida não pertence a esta casa."
"Votre compte a été bloqué par l'administrateur du site.": "A sua conta foi bloqueada pelo administrador do site."
"Vous avez atteint la limite de scans par IA pour cette heure : remplissez les champs vous-même.": "Atingiu o limite de digitalizações com IA para esta hora: preencha os campos manualmente."
"Vous devez être connecté.": "Tem de iniciar sessão."
"Vous n'avez pas accès à cette ressource.": "Não tem acesso a este recurso."
"Vous ne pouvez pas modifier votre propre compte depuis le back office.": "Não pode alterar a sua própria conta a partir do back office."
"Vous ne pouvez pas supprimer ce commentaire.": "Não pode eliminar este comentário."
"Vous ne pouvez pas supprimer votre propre compte depuis le back office.": "Não pode eliminar a sua própria conta a partir do back office."
"Vous ne pouvez pas vous prêter un article.": "Não pode emprestar um artigo a si próprio."
"Zone de tenue inconnue.": "Zona do conjunto desconhecida."
"Écrivez un message.": "Escreva uma mensagem."
