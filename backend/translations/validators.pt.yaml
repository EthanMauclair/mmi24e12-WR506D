# Messages des contraintes de validation : le texte français sert de clé (langue principale de l'application)
"Ce membre fait déjà partie du logement.": "Este membro já faz parte da casa."
"Ce pseudo est déjà utilisé.": "Este nome de utilizador já está a ser usado."
"Cet abonnement existe déjà.": "Já segue este membro."
"Cet article a déjà une annonce en ligne ou réservée.": "Este artigo já tem um anúncio publicado ou reservado."
"Cet article est déjà prêté.": "Este artigo já está emprestado."
"Cet email est déjà utilisé.": "Este e-mail já está a ser usado."
"Cette catégorie existe déjà à cet endroit.": "Esta categoria já existe neste local."
"Cette couleur existe déjà.": "Esta cor já existe."
"Cette date n'est pas valide.": "Esta data não é válida."
"Cette marque existe déjà.": "Esta marca já existe."
"Cette tenue est déjà likée.": "Já gosta deste conjunto."
"Cette étiquette existe déjà dans ce logement.": "Esta etiqueta já existe nesta casa."
"Choisissez un mot de passe.": "Escolha uma palavra-passe."
"Choisissez un nom d'utilisateur.": "Escolha um nome de utilizador."
"Indiquez votre date de naissance.": "Indique a sua data de nascimento."
"Indiquez votre e-mail.": "Indique o seu e-mail."
"La date de retour ne peut pas précéder la date de prêt.": "A data de devolução não pode ser anterior à data do empréstimo."
"La date de retour prévue ne peut pas précéder la date de prêt.": "A data de devolução prevista não pode ser anterior à data do empréstimo."
"Le code EAN doit contenir entre 8 et 13 chiffres.": "O código EAN deve ter entre 8 e 13 algarismos."
"Le mot de passe doit contenir au moins 8 caractères.": "A palavra-passe deve ter pelo menos 8 caracteres."
"Le stockage doit appartenir au logement de l'article.": "A arrumação deve pertencer à casa do artigo."
"Le tuteur doit être majeur.": "O tutor tem de ser maior de idade."
"Le vendeur ne peut pas être l'acheteur de son propre article.": "O vendedor não pode comprar o seu próprio artigo."
"Seul le membre qui a ajouté cet article peut le vendre.": "Só o membro que adicionou este artigo o pode vender."
"Seul son créateur peut supprimer cette tenue.": "Só quem o criou pode eliminar este conjunto."
"Seul un abonné accepté peut être choisi comme ami.": "Só um seguidor aceite pode ser escolhido como amigo."
"Seuls les amis de ce membre peuvent commenter ses articles.": "Só os amigos deste membro podem comentar os artigos dele."
"Seuls les amis de ce membre peuvent commenter ses tenues.": "Só os amigos deste membro podem comentar os conjuntos dele."
"Un abonnement à un profil privé commence en attente, sinon il est accepté.": "Seguir um perfil privado começa como pendente; caso contrário, é aceite."
"Un article personnel ne peut pas figurer dans une tenue publique.": "Um artigo pessoal não pode fazer parte de um conjunto público."
"Un article personnel ne peut pas être commenté.": "Um artigo pessoal não pode ser comentado."
"Un article personnel ne peut pas être mis en vente.": "Um artigo pessoal não pode ser posto à venda."
"Un commentaire porte soit sur un article, soit sur une tenue.": "Um comentário diz respeito a um artigo ou a um conjunto."
"Un membre majeur ne peut pas avoir le rôle mineur.": "Um membro maior de idade não pode ter o papel de menor."
"Un membre mineur a forcément le rôle mineur.": "Um membro menor tem obrigatoriamente o papel de menor."
"Un membre mineur doit être rattaché à un tuteur.": "Um membro menor tem de estar associado a um tutor."
"Un membre mineur ne peut pas créer de logement.": "Um membro menor não pode criar uma casa."
"Un membre mineur ne peut rejoindre que le logement de son tuteur.": "Um membro menor só pode juntar-se à casa do seu tutor."
"Un membre ne peut pas s'abonner à lui-même.": "Um membro não se pode seguir a si próprio."
"Un membre ne peut pas être son propre tuteur.": "Um membro não pode ser o seu próprio tutor."
"Un stockage porte déjà ce nom dans cette pièce.": "Já existe uma arrumação com este nome nesta divisão."
"Une conversation existe déjà pour cette annonce.": "Já existe uma conversa para este anúncio."
"Une pièce porte déjà ce nom dans ce logement.": "Já existe uma divisão com este nome nesta casa."
"Une tenue contient au moins un article.": "Um conjunto contém pelo menos um artigo."
"Une tenue ne contient que des articles de son créateur.": "Um conjunto só contém artigos de quem o criou."
"Utilisez uniquement des lettres sans accent, des chiffres, des points, des tirets ou des tirets bas.": "Use apenas letras sem acento, algarismos, pontos, hífenes ou sublinhados."
"Vous devez accepter les conditions d'utilisation.": "Tem de aceitar os termos de utilização."
