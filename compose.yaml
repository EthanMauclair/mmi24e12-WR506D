services:
  database:
    image: mariadb:${MARIADB_VERSION:-13.0}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql

  php:
    build: ./docker/php
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@database:3306/${MARIADB_DATABASE}?serverVersion=${MARIADB_SERVER_VERSION:-13.0.2-MariaDB}&charset=utf8mb4
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELE: ${OPENROUTER_MODELE:-google/gemma-4-31b-it:free}
      OPENROUTER_MODELE_SECOURS: ${OPENROUTER_MODELE_SECOURS-google/gemma-4-26b-a4b-it:free}
    volumes:
      - ./backend:/var/www/backend
      # Dépendances, cache, logs et sessions hors du dossier partagé avec l'hôte :
      # beaucoup plus rapide sous Windows et macOS
      - backend_vendor:/var/www/backend/vendor
      - backend_var:/var/www/backend/var
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://nginx
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

volumes:
  backend_vendor:
  backend_var:
  database_data:
  frontend_node_modules:
