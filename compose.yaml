# Stack de développement Penderie
#   database : MariaDB 12.3 LTS
#   php      : PHP 8.2 FPM + Symfony 7.4 LTS (API)
#   nginx    : serveur web devant PHP-FPM  -> http://localhost:8080
name: penderie

services:
  database:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Copier .env.example en .env}
      MARIADB_USER: ${MARIADB_USER:?Copier .env.example en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Copier .env.example en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Copier .env.example en .env}
    volumes:
      - database_data:/var/lib/mysql
    ports:
      # Accès depuis un client SQL installé sur la machine (DBeaver, HeidiSQL...)
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  php:
    build: ./docker/php
    environment:
      DATABASE_URL: "mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@database:3306/${MARIADB_DATABASE}?serverVersion=12.3.2-MariaDB&charset=utf8mb4"
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  database_data:
